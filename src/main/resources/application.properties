# ============================================================================
# Hospital Management System - Application Configuration
# ============================================================================

# Database Configuration (MySQL 8.0 Default)
# Override via environment variables: DB_URL, DB_USER, DB_PASSWORD
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/hospital_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.user=root
db.password=root

# Embedded/Fallback database mode when MySQL is offline or not configured
# Options: mysql (strict MySQL), auto (tries MySQL first; falls back to embedded H2 for seamless demo)
db.mode=auto
db.h2.url=jdbc:h2:mem:hospital_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
db.h2.user=sa
db.h2.password=

# HikariCP Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000
db.pool.maxLifetime=1800000

# Hospital Information
hospital.name=Apex Care Multi-Specialty Hospital
hospital.tagline=Excellence in Healthcare & Patient Care
hospital.address=742 Evergreen Terrace, Medical District, Suite 100
hospital.phone=+1 (555) 234-5678
hospital.email=contact@apexcarehospital.com
hospital.taxRate=5.00
hospital.currencySymbol=$

# Security & Session Settings
session.timeoutMinutes=60
security.bcryptCost=12
